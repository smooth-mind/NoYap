name: NoYap validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate NoYap governance
        run: python scripts/noyap.py validate
      - name: Test NoYap helper
        run: python -m unittest discover -s tests -v
